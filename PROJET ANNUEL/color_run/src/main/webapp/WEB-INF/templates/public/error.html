<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Erreur - Color Run</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white rounded-lg shadow-lg p-8 max-w-md text-center">
  <!-- Icône erreur -->
  <div class="text-red-500 mb-4">
    <i class="fas fa-exclamation-triangle fa-3x"></i>
  </div>

  <!-- Message d'erreur -->
  <h1 class="text-2xl font-bold text-gray-800 mb-2">Oups... une erreur est survenue</h1>
  <p class="text-gray-600 mb-6" th:text="${error}">Impossible d'accéder à la base. Veuillez redémarrer la base de données svp.</p>

  <!-- Boutons -->
  <div class="flex flex-col space-y-3">
    <a th:href="@{/}"
       class="w-full bg-purple-600 text-white px-4 py-2 rounded-md hover:bg-purple-700 transition">
      Retour à l'accueil
    </a>
    <a href="mailto:support@colorrun.fr"
       class="w-full bg-gray-200 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-300 transition">
      Contacter le support
    </a>
  </div>
</div>

</body>
</html>
